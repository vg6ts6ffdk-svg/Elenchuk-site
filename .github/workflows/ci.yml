name: Validate site

on:
  push:
    branches: ["main", "site-audit-fixes-v2"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check script.js
          node --check build-pages.mjs
          node --check validate-site.mjs

      - name: Check required source files
        run: |
          test -f index.html
          test -f style.css
          test -f theme.css
          test -f brand.css
          test -f mobile-fix.css
          test -f script.js
          test -f server.js
          test -f admin.html
          test -f CNAME

      - name: Build production site
        env:
          ROSEEN_API_BASE: https://api.roseen.ru
        run: node build-pages.mjs

      - name: Validate production links and assets
        run: node validate-site.mjs dist
