name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Branch-based Pages currently runs alongside this workflow. Publish the
  # built site after that legacy run so raw sources cannot remain live.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm ci

      - name: Build public site
        env:
          ROSEEN_API_BASE: ${{ vars.ROSEEN_API_BASE }}
          ROSEEN_STOREFRONT_PUBLIC: '1'
        run: node build-pages.mjs

      - name: Validate production output
        env:
          ROSEEN_STOREFRONT_PUBLIC: '1'
        run: node validate-site.mjs dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
