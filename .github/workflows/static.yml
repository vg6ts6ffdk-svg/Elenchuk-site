name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        env:
          ROSEEN_API_BASE: ${{ vars.ROSEEN_API_BASE }}
        run: |
          export ROSEEN_API_BASE="${ROSEEN_API_BASE:-https://api.roseen.ru}"
          rm -rf dist
          mkdir -p dist/assets
          for file in *.html; do
            if [ "$file" != "page-template.html" ]; then cp "$file" dist/; fi
          done

          # Publish a self-contained stylesheet: the original layout CSS first,
          # then the branded light-teal theme overrides. This prevents an old
          # cached theme from restoring the previous dark palette.
          cat style.css theme.css > dist/style.css
          cp theme.css script.js scroll.js logo.svg robots.txt sitemap.xml CNAME dist/
          cp robots.jpg dist/assets/robot-lab.png
          cp electronics.jpg dist/assets/electronics-lab.png
          cp home-appliances.jpg dist/assets/appliance-lab.png
          cp robot-cta.jpg dist/assets/robot-cta.jpg
          cp logo.svg dist/assets/logo.svg

          API_BASE_JSON=$(node -p 'JSON.stringify(process.env.ROSEEN_API_BASE || "")')
          for file in dist/*.html; do
            # Normalize the stylesheet reference to one versioned URL.
            sed -i -E 's#<link rel="stylesheet" href="[^\"]*style\.css[^\"]*">##g' "$file"
            sed -i -E 's#<link rel="stylesheet" href="[^\"]*theme\.css[^\"]*">##g' "$file"
            sed -i 's#</head>#<link rel="stylesheet" href="style.css?v=11"></head>#' "$file"

            # Replace all script.js references and inject the production API base.
            sed -i -E "s#<script src=\"\.?/script\.js[^\"]*\"></script>##g" "$file"
            sed -i "s#</body>#<script>window.ROSEEN_API_BASE=${API_BASE_JSON};</script><script src=\"script.js?v=6\"></script></body>#" "$file"

            # Cache-bust the branded logo asset.
            sed -i -E 's#assets/logo\.svg(\?v=[0-9]+)?#assets/logo.svg?v=4#g' "$file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
