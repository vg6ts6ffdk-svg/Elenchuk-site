name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        env:
          ROSEEN_API_BASE: ${{ vars.ROSEEN_API_BASE }}
        run: |
          export ROSEEN_API_BASE="${ROSEEN_API_BASE:-https://api.roseen.ru}"
          rm -rf dist
          mkdir -p dist/assets
          for file in *.html; do
            if [ "$file" != "page-template.html" ]; then cp "$file" dist/; fi
          done

          # Keep the original layout CSS, then apply the branded theme and a
          # final brand layer. The approved logo is copied byte-for-byte.
          cat style.css theme.css brand.css > dist/style.css
          cp theme.css brand.css script.js scroll.js logo.svg robots.txt sitemap.xml CNAME dist/
          cp robots.jpg dist/assets/robot-lab.png
          cp electronics.jpg dist/assets/electronics-lab.png
          cp home-appliances.jpg dist/assets/appliance-lab.png
          cp robot-cta.jpg dist/assets/robot-cta.jpg
          cp logo.svg dist/assets/logo.svg

          API_BASE_JSON=$(node -p 'JSON.stringify(process.env.ROSEEN_API_BASE || "")')
          for file in dist/*.html; do
            # One deterministic, versioned stylesheet reference.
            sed -i -E 's#<link rel="stylesheet" href="[^\"]*style\.css[^\"]*">##g' "$file"
            sed -i -E 's#<link rel="stylesheet" href="[^\"]*theme\.css[^\"]*">##g' "$file"
            sed -i -E 's#<link rel="stylesheet" href="[^\"]*brand\.css[^\"]*">##g' "$file"
            sed -i 's#</head>#<link rel="stylesheet" href="style.css?v=14"></head>#' "$file"

            # Exactly one versioned script reference.
            perl -0pi -e 's#<script src="(?:\./)?script\.js(?:\?[^" ]*)?"></script>##g' "$file"
            sed -i "s#</body>#<script>window.ROSEEN_API_BASE=${API_BASE_JSON};</script><script src=\"script.js?v=9\"></script></body>#" "$file"

            # Keep the approved ROSEEN logo unchanged; only bust the browser cache.
            sed -i -E 's#assets/logo\.svg(\?v=[0-9]+)?#assets/logo.svg?v=5#g' "$file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
