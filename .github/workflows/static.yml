name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        run: |
          rm -rf dist
          mkdir -p dist/assets
          for file in *.html; do
            if [ "$file" != "page-template.html" ]; then cp "$file" dist/; fi
          done
          cp style.css script.js scroll.js logo.svg robots.txt sitemap.xml dist/
          cp robots.jpg dist/assets/robot-lab.png
          cp electronics.jpg dist/assets/electronics-lab.png
          cp home-appliances.jpg dist/assets/appliance-lab.png
          cp robot-cta.jpg dist/assets/robot-cta.jpg
          cp logo.svg dist/assets/logo.svg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
