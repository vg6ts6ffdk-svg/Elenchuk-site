<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ROSEEN — Заявки сервиса</title>
<link rel="icon" href="logo-approved.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script src="api-config.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>
<main class="admin-wrap">
<a href="index.html">← На сайт ROSEEN</a>
<h1>Заявки сервиса</h1>
<p id="notice" role="status" aria-live="polite"></p>
<section id="login-panel" class="admin-panel" hidden>
<h2>Вход сотрудника</h2>
<form id="login-form">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" maxlength="254"></div>
<div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
<button class="btn btn-primary" type="submit">Войти</button>
</form>
</section>
<section id="app" hidden>
<div class="admin-toolbar"><button id="refresh" class="btn btn-ghost" type="button">Обновить список</button><button id="logout" class="btn btn-ghost" type="button">Выйти</button></div>
<div class="admin-columns">
<section aria-label="Список заявок"><div id="list" class="admin-list"></div><button id="more" class="btn btn-ghost" type="button" hidden>Показать ещё</button></section>
<section id="detail" class="admin-panel" aria-label="Карточка заявки" hidden></section>
</div>
</section>
<noscript><p>Для защищённой админ-панели требуется JavaScript.</p></noscript>
</main>
</body>
</html>
