<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSEEN — Admin</title>
<style>
:root{--g:#60993b;--bg:#101318;--s:#181d24;--line:#303742;--t:#f4f6f8;--m:#9ba5b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:40px 0}.login,.panel{background:var(--s);border:1px solid var(--line);border-radius:22px;padding:28px}.login{max-width:420px;margin:10vh auto}.logo{color:var(--g);font-size:28px;font-weight:900;letter-spacing:.08em}input,select,textarea{width:100%;background:#0f1216;border:1px solid var(--line);color:white;border-radius:10px;padding:12px;margin:7px 0 14px}button{border:0;border-radius:10px;background:var(--g);padding:12px 18px;font-weight:800;cursor:pointer}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.cards{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#12161b;cursor:pointer}.card:hover{border-color:var(--g)}.meta{color:var(--m);font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#273025;color:#bce19f;font-size:11px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.file-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.file-row button{padding:8px 12px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.file-row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div id="login" class="login"><div class="logo">ROSEEN</div><p>Админ-панель сервиса</p><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button onclick="login()">Войти</button><p id="msg"></p></div>
<div id="app" class="hidden"><div class="toolbar"><div><div class="logo">ROSEEN / SERVICE</div><div class="meta">Заявки на ремонт</div></div><button onclick="logout()">Выйти</button></div><div class="panel"><div class="toolbar"><h2>Заявки</h2><button onclick="load()">Обновить</button></div><div id="list" class="cards"></div></div><div id="detail" class="panel hidden" style="margin-top:14px"></div></div>
</div><script>
const API_BASE=(window.ROSEEN_API_BASE||'').replace(/\/$/,'');
let token=localStorage.getItem("roseen_token");
const statuses={new:"Новая",diagnostics:"Диагностика",approval:"Согласование",repair:"В ремонте",ready:"Готово",closed:"Закрыта"};
const loginBox=document.getElementById("login"),app=document.getElementById("app"),email=document.getElementById("email"),password=document.getElementById("password"),msg=document.getElementById("msg"),list=document.getElementById("list"),detail=document.getElementById("detail");
function show(){loginBox.classList.toggle("hidden",!!token);app.classList.toggle("hidden",!token);if(token)load()}
async function login(){try{const r=await fetch(`${API_BASE}/api/auth/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Не удалось войти");token=d.token;localStorage.setItem("roseen_token",token);msg.textContent="";show()}catch(e){msg.textContent=e.message}}
function logout(){localStorage.removeItem("roseen_token");token=null;show()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};const r=await fetch(`${API_BASE}${url}`,opt);if(r.status===401){logout();throw Error("Сессия истекла")}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка запроса");return d}
async function load(){try{const rows=await api("/api/requests");list.innerHTML=rows.map(x=>`<div class="card" onclick="openReq(${x.id})"><div><b>Заявка №${x.id}</b> <span class="badge">${statuses[x.status]||x.status}</span></div><div>${escape(x.equipment_type)} ${x.model?"/ "+escape(x.model):""}</div><div class="meta">${escape(x.problem)} · файлов: ${x.files_count} · ${x.created_at}</div></div>`).join("")||"<p class=meta>Заявок пока нет.</p>"}catch(e){list.innerHTML=`<p class=meta>${escape(e.message)}</p>`}}
async function openReq(id){try{const x=await api("/api/requests/"+id);detail.classList.remove("hidden");detail.innerHTML=`<h2>Заявка №${x.id}</h2><div class=grid><div><b>Техника</b><p>${escape(x.equipment_type)} / ${escape(x.model||"—")}</p><b>Проблема</b><p>${escape(x.problem)}</p></div><div><b>Контакт</b><p>${escape(x.contact)}</p><label>Статус<select id="st">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${k===x.status?"selected":""}>${v}</option>`).join("")}</select></label><label>Комментарий<textarea id="co">${escape(x.comment||"")}</textarea></label><button onclick="save(${x.id})">Сохранить</button></div></div><h3>Файлы</h3>${x.files.map(f=>`<div class="file-row"><div><b>${escape(f.original_name)}</b><div class="meta">${escape(f.mime||"файл")} · ${Math.round((f.size||0)/1024)} KB</div></div><button onclick="downloadFile(${f.id},'${escapeJs(f.original_name)}')">Скачать</button></div>`).join("")||"<div class=meta>Нет файлов</div>"}`}catch(e){detail.classList.remove("hidden");detail.innerHTML=`<p class=meta>${escape(e.message)}</p>`}}
async function save(id){await api("/api/requests/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:document.getElementById("st").value,comment:document.getElementById("co").value})});await load();await openReq(id)}
async function downloadFile(id,name){const r=await fetch(`${API_BASE}/api/files/${id}`,{headers:{Authorization:"Bearer "+token}});if(!r.ok){if(r.status===401)logout();throw Error("Не удалось скачать файл")}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function escape(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeJs(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r?\n/g," ")}
show();
</script></body></html>
