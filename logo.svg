<rect width="760" height="190" rx="28" fill="none"/>

<!-- ROSEEN wordmark: the two E letters are the signature accent -->
<text x="34" y="92" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="2">ROS</text>
<text x="235" y="92" fill="#009E8A" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="2">EE</text>
<text x="343" y="92" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="2">N</text>

<!-- subtle signature line under the double E -->
<rect x="237" y="105" width="91" height="5" rx="2.5" fill="#009E8A"/>

<!-- The requested letter system: RO / SE / EN -->
<text x="37" y="139" fill="#667085" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">
<tspan fill="#009E8A">RO</tspan><tspan>BOTICS</tspan>
