services:
  - type: web
    name: roseen-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    domains:
      - api.roseen.ru
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: roseen-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://roseen.ru,https://www.roseen.ru,https://vg6ts6ffdk-svg.github.io
      - key: ADMIN_EMAIL
        value: admin@roseen.ru
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: roseen-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: roseen
    user: roseen
    postgresMajorVersion: "18"
    diskSizeGB: 1
